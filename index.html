function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function abrir(){
  var pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
  if(!pw)return;
  btn.disabled=true;err.textContent='';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:250000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent='Senha incorreta. Tente novamente.';btn.disabled=false;
    document.getElementById('pw').select();
  }
}
document.getElementById('go').addEventListener('click',abrir);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')abrir()});
</script>
